services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: feedguard-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedguard-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/feedguard}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - ml-service
      - mongo
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
    container_name: feedguard-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - INTERNAL_API_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: feedguard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
